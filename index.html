const ikon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IK[n]}</svg>`;

async function rest(m,yol,g,pref){
  const y=await fetch(SUPA+'/rest/v1/'+yol,{method:m,
    headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',
    Prefer:pref||'return=representation'},body:g?JSON.stringify(g):undefined});
  if(!y.ok)throw new Error((await y.text()).slice(0,160));
  const t=await y.text();return t?JSON.parse(t):[];
}
async function resim(kova,yol){
  if(!yol)return null;const k=kova+'/'+yol;
  if(resimCache[k])return resimCache[k];
  const y=await fetch(SUPA+'/storage/v1/object/'+k,{headers:{apikey:KEY,Authorization:'Bearer '+token}});
  if(!y.ok)return null;
  return resimCache[k]=URL.createObjectURL(await y.blob());
}
async function depoYaz(kova,ad,blob){
  const y=await fetch(SUPA+'/storage/v1/object/'+kova+'/'+ad,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'image/jpeg'},body:blob});
  if(!y.ok)throw new Error('depo hatası');return ad;
}

async function olusturCiz(){
  const T=$('tab');T.innerHTML='<div class="kart"><p class="acik">Havuz yükleniyor…</p></div>';
  const [sorular,siniflar,ogrList]=await Promise.all([
    rest('GET','sorular?select=id,metin,gosterim,ders,konu,dogru_cevap,kaynak&order=created_at&limit=500'),
    rest('GET','siniflar?select=id,ad&aktif=is.true'),
    rest('GET','profiller?select=id,ad_soyad&rol=eq.ogrenci&aktif=is.true&order=ad_soyad')]);
  const g={};sorular.forEach(q=>{const a=q.kaynak||'Diğer';(g[a]=g[a]||[]).push(q);});
  let gi=0;
  const gruplar=Object.entries(g).map(([ad,list])=>{gi++;return `
    <div style="border:1.5px solid var(--c);border-radius:12px;margin-bottom:10px;overflow:hidden">
      <div class="sinavBas" data-g="${gi}" style="display:flex;gap:8px;align-items:center;padding:10px;background:var(--z);cursor:pointer">
        <input type="checkbox" class="gSec" data-g="${gi}" style="width:19px;height:19px;flex:0 0 auto">
        <b style="flex:1;min-width:0;font-size:14px">${ad.replace(/</g,'&lt;')}</b>
        <span class="etiket">${list.length} soru</span>
        <button class="buton kucuk" data-sil="${ad.replace(/"/g,'&quot;')}" style="background:var(--yn);color:#fff">Sil</button>
        <span class="gOk" style="color:var(--s);font-weight:800">▾</span>
      </div>
      <div class="gIc" data-g="${gi}" style="display:none;padding:4px 10px">
        ${list.map(q=>`
        <div class="soruSatir"><input type="checkbox" class="sSec" data-id="${q.id}" data-dc="${q.dogru_cevap||''}" ${q.dogru_cevap?'':'disabled'}>
        <div class="oz"><span class="etiket ${q.gosterim==='dijital'?'e-dij':'e-kir'}">${q.gosterim==='dijital'?'DİJİTAL':'KIRPIM'}</span>
        ${q.konu?`<span class="etiket">${q.konu}</span>`:''}
        <div>${q.metin?q.metin.slice(0,80).replace(/</g,'&lt;')+'…':'<i style="color:var(--s)">görüntü soru</i>'}</div></div>
        <select class="cSec" data-id="${q.id}" style="width:60px;flex:0 0 auto"><option value="">—</option>${'ABCD'.split('').map(x=>`<option${q.dogru_cevap===x?' selected':''}>${x}</option>`).join('')}</select>
        </div>`).join('')}
      </div>
    </div>`;}).join('');
  T.innerHTML=`<div class="kart"><h3>Sınav arşivinden oluştur</h3>
    <p class="acik">Kaynağı açın, soruları seçin (başlık kutusu tümünü seçer); cevap düzeltme yandaki listeden.</p>
    <label>SINAV ADI</label><input id="oAd" placeholder="Örn: Kareköklü Sayılar Tarama 1">
    <div class="izgara2">
      <div><label>SÜRE (DK, 0=YOK)</label><input id="oSure" type="number" value="20"></div>
      <div><label>NET KATSAYISI</label><select id="oKat"><option value="3">3'e 1</option><option value="4">4'e 1</option><option value="0">Götürmez</option></select></div></div>
    <label>HEDEF — SINIF YA DA ÖĞRENCİ</label><select id="oHedef">
      <optgroup label="Sınıflar">${siniflar.map(x=>`<option value="s:${x.id}">${x.ad}</option>`).join('')}</optgroup>
      <optgroup label="Öğrenciye özel">${ogrList.map(x=>`<option value="o:${x.id}">${x.ad_soyad}</option>`).join('')}</optgroup></select>
    <label>SORULAR (<span id="oSec">0</span> seçili)</label>
    <div id="oListe">${gruplar||'<p class="acik">Arşiv boş — Soru İstasyonu ile sınav yükleyin.</p>'}</div>
    <button class="buton" id="oYayin" style="margin-top:10px">Sınavı oluştur ve yayınla</button>
    <div class="acik" id="oDurum" style="margin-top:8px"></div></div>`;
  mat($('oListe'));
  const say=()=>{$('oSec').textContent=T.querySelectorAll('.sSec:checked').length};
  T.querySelectorAll('.sSec').forEach(c=>c.onchange=say);
  T.querySelectorAll('.sinavBas').forEach(b=>b.onclick=e=>{
    if(e.target.closest('button,input,select'))return;
    const ic=T.querySelector('.gIc[data-g="'+b.dataset.g+'"]');
    const acik=ic.style.display!=='none';
    ic.style.display=acik?'none':'block';
    b.querySelector('.gOk').textContent=acik?'▾':'▴';});

    const ic=T.querySelector('.gIc[data-g="'+c.dataset.g+'"]');

    if(c.checked){ic.style.display='block';}say();});

    if(!confirm('"'+b.dataset.sil+'" kaynağındaki tüm sorular silinsin mi?'))return;

    try{await rest('PATCH','sorular?id=eq.'+sec.dataset.id,{dogru_cevap:sec.value||null},'return=minimal');
      const cb=sec.closest('.soruSatir').querySelector('.sSec');
      cb.disabled=!sec.value;cb.dataset.dc=sec.value;if(!sec.value)cb.checked=false;say();}

    try{
      const sv=(await rest('POST','sinavlar',{ad:$('oAd').value.trim(),soru_sayisi:secili.length,
        sik_sayisi:4,sure_dakika:+$('oSure').value||null,net_katsayi:+$('oKat').value,
        olusturan_id:uid,yayinda:true}))[0];
      await rest('POST','sinav_sorular',secili.map((c,i)=>({sinav_id:sv.id,soru_id:c.dataset.id,sira:i+1})),'return=minimal');
      await rest('POST','cevap_anahtari',secili.map((c,i)=>({sinav_id:sv.id,soru_no:i+1,dogru_cevap:c.dataset.dc})),'return=minimal');
      const h=$('oHedef').value;
      await rest('POST','sinav_atamalari',
        h.startsWith('o:')?{sinav_id:sv.id,ogrenci_id:h.slice(2)}:{sinav_id:sv.id,sinif_id:h.slice(2)},'return=minimal');
      $('oDurum').textContent='✓ "'+sv.ad+'" yayınlandı.';
    }catch(e){$('oDurum').textContent='Hata: '+e.message;}
    $('oYayin').disabled=false;
  };
}

    <td class="sag">${x.bos}</td><td class="sag"><b>${(+x.net).toFixed(2).replace('.',',')}</b></td></tr>`).join('')}</table>
    <button class="buton gri" id="csv" style="margin-top:10px">CSV / Excel indir</button>`
    :'<p class="acik">Henüz sonuç yok.</p>'}</div>`;
  const csvBtn=$('csv');
  if(csvBtn)csvBtn.onclick=()=>{
    const csv='\uFEFFÖğrenci;Sınav;Doğru;Yanlış;Boş;Net;Tarih\n'+r.map(x=>
      [x.profiller.ad_soyad,x.sinavlar.ad,x.dogru,x.yanlis,x.bos,(''+x.net).replace('.',','),x.hesaplama.slice(0,10)].join(';')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='mentorcall-sonuclar.csv';a.click();
  };
  $('aBtn').onclick=async()=>{
    $('aSonuc').innerHTML='<p class="acik">Hesaplanıyor…</p>';
    const [an,snt]=await Promise.all([
      rest('POST','rpc/soru_analiz',{p_sinav:$('aSinav').value}),
      rest('GET','sonuclar?sinav_id=eq.'+$('aSinav').value+'&select=net').catch(()=>[])]);
    if(!an.length)return $('aSonuc').innerHTML='<p class="acik">Bu sınavda tamamlanmış oturum yok.</p>';
    const netv=snt.map(x=>+x.net),ortN=netv.length?(netv.reduce((a,b)=>a+b,0)/netv.length):0;
    const kutu3=(d,e,r)=>`<div style="flex:1;background:var(--z);border-radius:12px;padding:10px;text-align:center">
      <div style="font-size:20px;font-weight:900;color:${r}">${d}</div>
      <div style="font-size:10px;color:var(--s);font-weight:800">${e}</div></div>`;
    $('aSonuc').innerHTML=`<div style="display:flex;gap:8px;margin:10px 0">
      ${kutu3(netv.length,'KATILAN','var(--m)')}
      ${kutu3(ortN.toFixed(2).replace('.',','),'ORT. NET','var(--dg)')}
      ${kutu3(netv.length?Math.max(...netv).toFixed(2).replace('.',','):'—','EN YÜKSEK','var(--a)')}</div>`+'<table><tr><th>Soru</th><th class="sag">D</th><th class="sag">Y</th><th class="sag">B</th><th style="width:40%">Yanlış oranı</th></tr>'+
      an.map(q=>{const top=+q.dogru+ +q.yanlis+ +q.bos||1;const oran=Math.round(q.yanlis/top*100);

      <td class="sag" style="color:var(--yn)">${q.yanlis}</td><td class="sag">${q.bos}</td>
      <td><div class="cubuk"><i style="width:${oran}%"></i></div><small style="color:var(--s)">%${oran}</small></td></tr>`;}).join('')+'</table>';
  };
}

  $('govde').innerHTML=`<div class="sekme"><div class="yanLogo"><svg viewBox="0 0 140 116" width="26"><rect x="20" y="28" width="98" height="62" rx="15" fill="none" stroke="#D2402F" stroke-width="12" transform="rotate(-2 69 59)"/><path d="M36 88 l7 17 14-12z" fill="#D2402F"/><polygon points="56,26 90,12 124,26 90,40" fill="#16304F" transform="rotate(-6 90 26)"/></svg><b>mentor<span>call</span></b></div><input class="yanAra" placeholder="Menüde ara…">
    <button id="tVo" class="on">${ikon('yukselis')}Özet</button>
    <button id="tVd">${ikon('megafon')}Duyurular</button></div><div id="tab"></div>`;
  const tablar={tVo:veliOzet,tVd:oDuyuruCiz};

    Object.keys(tablar).forEach(x=>$(x).classList.toggle('on',x===id));tablar[id]();});

async function veliOzet(){
  const T=$('tab');T.innerHTML='<div class="kart"><p class="acik">Yükleniyor…</p></div>';
  const c=await rest('POST','rpc/veli_cocuklar');
  if(!c.length){T.innerHTML='<div class="kart"><h3>Hoş geldiniz</h3><p class="acik">Hesabınıza bağlı öğrenci bulunamadı. Kurum yöneticisiyle iletişime geçin.</p></div>';return;}
  T.innerHTML=`<div class="kart"><label>ÖĞRENCİ</label>
    <select id="vSec">${c.map(x=>`<option value="${x.id}">${x.ad_soyad}</option>`).join('')}</select></div><div id="vIc"></div>`;
  $('vSec').onchange=vYukle;vYukle();
  async function vYukle(){
    $('vIc').innerHTML='<div class="kart"><p class="acik">Yükleniyor…</p></div>';
    const o=await rest('POST','rpc/veli_ozet',{p_ogrenci:$('vSec').value});
    const g=o?.gorevler||[],sn=o?.sonuclar||[];
    $('vIc').innerHTML=`<div class="kart"><h3>Bugünün görevleri</h3>${g.length?g.map(x=>`
      <div class="havuzOge"><div style="flex:1;min-width:0"><b style="font-size:14px">${x.ders}</b>
      <span style="color:var(--s);font-size:13px"> ${x.konu||''}</span>
      <div style="color:var(--s);font-size:12.5px;margin-top:2px">hedef ${x.hedef} ${x.birim} · yapılan ${x.yapilan??'—'}</div></div>
      <span class="etiket ${x.onay?'e-dij':''}">${x.onay?'Onaylı ✓':'Bekliyor'}</span></div>`).join('')
      :'<p class="acik">Bugün için görev tanımlanmamış.</p>'}</div>
      <div class="kart"><h3>Son sınav sonuçları</h3>${sn.length?`
      <table><tr><th>Sınav</th><th class="sag">D</th><th class="sag">Y</th><th class="sag">B</th><th class="sag">Net</th></tr>
      ${sn.map(x=>`<tr><td>${x.ad.slice(0,24)}</td><td class="sag" style="color:var(--dg)">${x.d}</td>
      <td class="sag" style="color:var(--yn)">${x.y}</td><td class="sag">${x.b}</td>
      <td class="sag"><b>${(+x.net).toFixed(2).replace('.',',')}</b></td></tr>`).join('')}</table>`
      :'<p class="acik">Henüz tamamlanmış sınav yok.</p>'}</div>`;
  }
}

/* ---- Duyurular ---- */
async function duyuruCiz(){
  const T=$('tab');T.innerHTML='<div class="kart"><p class="acik">Yükleniyor…</p></div>';
  const [sin,liste]=await Promise.all([
    rest('GET','siniflar?select=id,ad&aktif=is.true'),
    rest('GET','duyurular?select=id,metin,sinif_id,created_at,profiller(ad_soyad),siniflar(ad)&order=created_at.desc&limit=30')]);
  T.innerHTML=`<div class="kart"><h3>Duyuru yayınla</h3>
    <label>METİN</label><textarea id="dMetin" placeholder="Örn: Cumartesi TYT denemesi 10:00'da başlayacaktır."></textarea>
    <label>HEDEF</label><select id="dSinif"><option value="">Tüm kurum</option>${sin.map(x=>`<option value="${x.id}">${x.ad}</option>`).join('')}</select>
    <button class="buton" id="dGonder" style="margin-top:10px">Duyuruyu yayınla</button></div>
    <div class="kart"><h3>Yayında olanlar</h3><div id="dListe">${liste.map(d=>`
      <div class="havuzOge" data-id="${d.id}"><div style="flex:1;min-width:0">
        <span class="etiket">${d.sinif_id?(d.siniflar?.ad||'Sınıf'):'Tüm kurum'}</span>
        <span class="etiket" style="background:var(--z);color:var(--s)">${d.created_at.slice(0,10)} · ${(d.profiller?.ad_soyad||'')}</span>
        <div style="margin-top:6px;font-size:14px;line-height:1.55">${d.metin.replace(/</g,'&lt;')}</div></div>
        <button class="buton kucuk" style="background:var(--yn);color:#fff">Sil</button></div>`).join('')||'<p class="acik">Henüz duyuru yok.</p>'}</div></div>`;
  $('dGonder').onclick=async()=>{
    if(!$('dMetin').value.trim())return;
    $('dGonder').disabled=true;
    await rest('POST','duyurular',{metin:$('dMetin').value.trim(),sinif_id:$('dSinif').value||null,yazan_id:uid},'return=minimal');
    duyuruCiz();};
  T.querySelectorAll('[data-id] .buton').forEach(b=>b.onclick=async()=>{
    if(!confirm('Duyuru silinsin mi?'))return;
    await rest('DELETE','duyurular?id=eq.'+b.closest('[data-id]').dataset.id,null,'return=minimal');duyuruCiz();});
}
async function oDuyuruCiz(){
  const T=$('tab');T.innerHTML='<div class="kart"><p class="acik">Yükleniyor…</p></div>';
  const liste=await rest('GET','duyurular?select=metin,sinif_id,created_at,siniflar(ad)&order=created_at.desc&limit=30');
  T.innerHTML=`<div class="kart"><h3>Duyurular</h3>${liste.map(d=>`
    <div class="havuzOge"><div style="flex:1">
      <span class="etiket">${d.sinif_id?(d.siniflar?.ad||'Sınıfınız'):'Tüm kurum'}</span>
      <span class="etiket" style="background:var(--z);color:var(--s)">${d.created_at.slice(0,10)}</span>
      <div style="margin-top:6px;font-size:14.5px;line-height:1.6">${d.metin.replace(/</g,'&lt;')}</div></div></div>`).join('')||'<p class="acik">Duyuru yok.</p>'}</div>`;
  const r=$('rzD');if(r)r.style.display='none';
}

/* ---- bildirim rozetleri ---- */
async function rozetler(){
  const koy=(id,n)=>{const e=$(id);if(!e)return;if(n>0){e.textContent=n>9?'9+':n;e.style.display='flex';}else e.style.display='none';};
  const dun=new Date(Date.now()-48*3600e3).toISOString();
  try{
    if(rol==='ogrenci'){
      const [duy,sv,ot,gr]=await Promise.all([
        rest('GET','duyurular?select=id&created_at=gte.'+dun),
        rest('GET','sinavlar?select=id&yayinda=is.true&arsivde=is.false'),
        rest('GET','oturumlar?select=sinav_id&ogrenci_id=eq.'+uid),
        rest('GET','gorevler?select=id&ogrenci_id=eq.'+uid+'&tarih=eq.'+bugun()+'&onaylandi=is.false')]);
      const coz=new Set(ot.map(x=>x.sinav_id));
      koy('rzD',duy.length);
      koy('rzSv',sv.filter(x=>!coz.has(x.id)).length);
      koy('rzG',gr.length);
    }else{
      const son=await rest('GET','sonuclar?select=id&hesaplama=gte.'+new Date(Date.now()-24*3600e3).toISOString());
      koy('rzS',son.length);
    }
  }catch(e){}
}

/* ================= ÖĞRENCİ ================= */
let SIN=null,SOR=[],OT=null,n=1,cevap={},kalan=0,tik=null;
function ogrenciAna(){
  $('altbar').style.display='none';clearInterval(tik);$('dolum').style.width='0%';
  $('kimlik').textContent=ad.toUpperCase()+' · ÖĞRENCİ';
  $('govde').innerHTML=`<div class="sekme"><div class="yanLogo"><svg viewBox="0 0 140 116" width="26"><rect x="20" y="28" width="98" height="62" rx="15" fill="none" stroke="#D2402F" stroke-width="12" transform="rotate(-2 69 59)"/><path d="M36 88 l7 17 14-12z" fill="#D2402F"/><polygon points="56,26 90,12 124,26 90,40" fill="#16304F" transform="rotate(-6 90 26)"/></svg><b>mentor<span>call</span></b></div><input class="yanAra" placeholder="Menüde ara…">
    <i class="grpEt">ANA</i>
    <button id="tBg" class="on">${ikon('saat')}Bugünüm</button>
    <button id="tSv">${ikon('belge')}Sınavlar<span class="rzt" id="rzSv" style="display:none"></span></button>
    <button id="tG">${ikon('kutu')}Görevler<span class="rzt" id="rzG" style="display:none"></span></button>
    <i class="grpEt">TAKİP</i>
    <button id="tGe">${ikon('yukselis')}Gelişim</button>
    <button id="tDy">${ikon('megafon')}Duyuru<span class="rzt" id="rzD" style="display:none"></span></button></div><div id="tab"></div>`;
  const tablar={tBg:bugunum,tSv:sinavListe,tG:gorevListe,tGe:gelisimCiz,tDy:oDuyuruCiz};
  rozetler();
  Object.keys(tablar).forEach(id=>$(id).onclick=()=>{
    Object.keys(tablar).forEach(x=>$(x).classList.toggle('on',x===id));tablar[id]();});

}
async function sinavListe(){
  const T=$('tab');T.innerHTML='<div class="kart"><p class="acik">Yükleniyor…</p></div>';
  const s=await rest('GET','sinavlar?select=id,ad,soru_sayisi,sure_dakika,net_katsayi&yayinda=is.true&arsivde=is.false&order=created_at.desc');
  T.innerHTML=s.length?s.map(x=>`
    <div class="kart sinavKart"><div class="rozet">${x.soru_sayisi}</div>
    <div style="flex:1"><b>${x.ad}</b><span>${x.soru_sayisi} soru${x.sure_dakika?' · '+x.sure_dakika+' dk':''}</span></div>
    <button class="buton kucuk" data-id="${x.id}">Başla</button></div>`).join('')
    :'<div class="kart"><p class="acik">Size atanmış sınav yok.</p></div>';
  T.querySelectorAll('.buton').forEach(b=>b.onclick=()=>sinavBasla(s.find(x=>x.id===b.dataset.id)));
}
async function sinavBasla(sv){
  SIN=sv;$('tab').innerHTML='<div class="kart"><p class="acik">Sorular hazırlanıyor…</p></div>';
  try{
    SOR=await rest('POST','rpc/sinav_sorulari',{p_sinav:sv.id});
    const eski=await rest('GET',`oturumlar?sinav_id=eq.${sv.id}&ogrenci_id=eq.${uid}&select=deneme_no&order=deneme_no.desc&limit=1`);
    const dn=(eski[0]?.deneme_no||0)+1;
    OT=(await rest('POST','oturumlar',{sinav_id:sv.id,ogrenci_id:uid,deneme_no:dn,resmi:dn===1}))[0];
    cevap={};n=1;
    if(sv.sure_dakika){kalan=sv.sure_dakika*60;
      tik=setInterval(()=>{kalan--;
        const t=String(Math.floor(kalan/60)).padStart(2,'0')+':'+String(kalan%60).padStart(2,'0');
        $('kimlik').textContent=t;
        const z=$('zamanYazi');if(z){z.textContent=t;
          $('zamanCip').classList.toggle('kritik',kalan<=60);}
        if(kalan<=0){clearInterval(tik);teslim();}},1000);}
    $('altbar').style.display='flex';soruGoster();
  }catch(e){$('tab').innerHTML=`<div class="kart"><p class="acik">Hata: ${e.message}</p></div>`;}
}
async function soruGoster(){
  const v=SOR[n-1];
  $('dolum').style.width=(Object.values(cevap).filter(Boolean).length/SOR.length*100)+'%';
  $('tab').innerHTML=`<div class="soruKart"><div class="kb"><div class="rozet">${n}</div>
    <b>${SIN.ad.toUpperCase().slice(0,22)} · ${n}/${SOR.length}</b>
    ${SIN.sure_dakika?`<span class="zaman" id="zamanCip">${ikon('saat')}<span id="zamanYazi">--:--</span></span>`:''}</div><div class="ic" id="ic"></div></div>
    <div class="qmap">${SOR.map((_,i)=>`<button class="qnum${cevap[i+1]?' dolu':''}${i+1===n?' aktif':''}" data-q="${i+1}">${i+1}</button>`).join('')}</div>
    <button class="buton" id="bitir" style="margin-top:12px">Sınavı bitir ve gönder</button>`;
  $('tab').querySelectorAll('.qnum').forEach(b=>b.onclick=()=>{n=+b.dataset.q;soruGoster();});
  const ic=$('ic');
  if(v.gosterim==='dijital'){
    if(v.metin){const p=document.createElement('p');p.className='mt';p.textContent=v.metin;ic.appendChild(p);mat(p);}
    if(v.gorsel_yolu){const u=await resim('soru-gorselleri',v.gorsel_yolu);
      if(u){const f=document.createElement('img');f.className='fg';f.src=u;ic.appendChild(f);}}
    (v.siklar||[]).forEach((s,i)=>{const d=document.createElement('div');d.className='sikG';
      d.innerHTML=`<b>${'ABCDE'[i]}</b><span></span>`;d.lastChild.textContent=s;ic.appendChild(d);mat(d.lastChild);});
  }else{
    const u=await resim('soru-gorselleri',v.kirpim_yolu);
    ic.innerHTML=u?`<img class="krp" src="${u}">`:'<p class="acik">Görüntü yüklenemedi.</p>';
  }
  $('bitir').onclick=()=>{if(confirm('Sınavı bitirmek istiyor musunuz?'))teslim();};
  balCiz();$('geri').disabled=n<=1;$('ileri').disabled=n>=SOR.length;
}
function balCiz(){
  $('bals').innerHTML=['A','B','C','D'].map(h=>
    `<button class="bal${cevap[n]===h?' dolu':''}" data-h="${h}">${h}</button>`).join('');
  $('bals').querySelectorAll('.bal').forEach(b=>b.onclick=()=>{
    const y=cevap[n]===b.dataset.h?null:b.dataset.h;cevap[n]=y;
    rest('POST','cevaplar',{oturum_id:OT.id,soru_no:n,cevap:y},
      'resolution=merge-duplicates,return=minimal').catch(()=>{});
    if(y&&n<SOR.length)n++;soruGoster();});
}
$('geri').onclick=()=>{if(n>1){n--;soruGoster()}};
$('ileri').onclick=()=>{if(n<SOR.length){n++;soruGoster()}};
async function teslim(){
  clearInterval(tik);$('altbar').style.display='none';
  $('kimlik').textContent=ad.toUpperCase()+' · ÖĞRENCİ';
  try{
    await rest('POST','rpc/sinavi_teslim_et',{p_oturum_id:OT.id});
    const r=(await rest('GET',`sonuclar?oturum_id=eq.${OT.id}&select=dogru,yanlis,bos,net`))[0];
    $('rNet').textContent=(+r.net).toFixed(2).replace('.',',');
    $('rD').textContent=r.dogru;$('rY').textContent=r.yanlis;$('rB').textContent=r.bos;
    $('sonucOrtu').style.display='flex';
  }catch(e){alert('Teslim hatası: '+e.message);}
}
$('rKapat').onclick=()=>{$('sonucOrtu').style.display='none';sinavListe();};

/* ---- Öğrenci: görevler ---- */
async function gorevListe(){
  const T=$('tab');
  T.innerHTML=`<div class="kart"><div class="izgara2"><div><label>TARİH</label>
    <input id="ogTarih" type="date" value="${bugun()}"></div></div></div><div id="ogG"></div>`;
  $('ogTarih').onchange=ogGorevYukle;ogGorevYukle();
}
async function ogGorevYukle(){
  const t=$('ogTarih').value,G=$('ogG');
  G.innerHTML='<div class="kart"><p class="acik">Yükleniyor…</p></div>';
  const g=await rest('GET',`gorevler?ogrenci_id=eq.${uid}&tarih=eq.${t}&order=created_at`);
  G.innerHTML=`<div class="kart"><h3>Görevlerim</h3>
    ${g.length?g.map(x=>gorevKart(x,false)).join(''):'<p class="acik">Bu gün için görev tanımlanmamış.</p>'}</div>`;
  gorevBagla(G);
}
function gorevBagla(G){
  G.querySelectorAll('[data-kaydet]').forEach(b=>b.onclick=async()=>{
    const kart=b.closest('.gorev'),id=b.dataset.kaydet;
    const al=s=>{const e=kart.querySelector(`[data-a="${s}"]`);return e&&e.value!==''?+e.value:null;};
    const dosyaEl=kart.querySelector('[data-kanit]');
    b.disabled=true;b.textContent='Kaydediliyor…';
    try{
      let kanit=null;
      if(dosyaEl&&dosyaEl.files[0]){
        const blob=await kucult(dosyaEl.files[0]);
        kanit=await depoYaz('kanitlar',`${uid}_${id}.jpg`,blob);
      }
      const yp=al('yapilan'),dg=al('dogru'),yn=al('yanlis');
      const g2={yapilan:yp,dogru:dg,yanlis:yn,ogrenilen:al('ogrenilen'),
        bos:(yp!=null&&dg!=null&&yn!=null)?Math.max(0,yp-dg-yn):null};
      if(kanit)g2.kanit_yolu=kanit;
      await rest('PATCH',`gorevler?id=eq.${id}`,g2,'return=minimal');
      b.textContent='Kaydedildi ✓';
    }catch(e){alert('Hata: '+e.message);b.textContent='Kaydet';}
    b.disabled=false;});
}
function kucult(dosya){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const ol=Math.min(1,1280/img.width);
    const c=document.createElement('canvas');
    c.width=img.width*ol;c.height=img.height*ol;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>res(b),'image/jpeg',0.78);};
  img.src=URL.createObjectURL(dosya);});}

    :'<p class="acik">Henüz tamamlanmış sınavınız yok.</p>'}</div>`;
}
